name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency added without relocking is caught here rather than on
      # someone else's machine.
      - name: Install the locked environment
        run: uv sync --locked --dev

      # The GFW extracts are gitignored, so the tests that need them skip.
      # Everything resting on the committed spatial layers, the removal list
      # and the pure functions still runs.
      - name: Run tests
        run: uv run python -m pytest -q

  # The R workflow's helpers and the tracked references/ files. Like pytest,
  # this needs no GFW data, so it runs on a bare clone.
  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the version renv.lock was made with
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      # system libraries for sf (GDAL, GEOS, PROJ, udunits)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      # restores renv.lock, cached between runs
      - uses: r-lib/actions/setup-renv@v2

      - name: Run R tests
        run: Rscript -e 'testthat::test_dir("r/tests/testthat", stop_on_failure = TRUE)'
