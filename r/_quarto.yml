# R workflow, rendered in run order with `quarto render r/` from the repo root.
#
# 01_pull_gfw.qmd is left out: it queries the GFW API and overwrites the raw
# extracts, so render it on its own (`quarto render r/01_pull_gfw.qmd`) only
# when a new pull is intended.
#
# 03_review_vessels.qmd needs the GARFO permit lists and the API caches in
# data/raw/vessel_evidence/. Without them, render 02 and 04 only:
#   quarto render r/02_build_grid.qmd && quarto render r/04_classify_aggregate.qmd
#
# Each qmd's setup chunk sets the knitr root to the repo root, so the paths in
# r/paths.R resolve however the qmd is run. execute-dir is left at its default
# because `project` would mean r/, not the repo root.
#
# No freeze: the qmds read data and references/ CSVs that Quarto does not
# track, so a frozen document would not re-run when a decision file changes.
#
# Phase 4 is three notebooks (D-101): 09a fits, 09 reports. 09b_bag_power.qmd
# (Step 3 simulation power, days of refits) is left out: it runs only after
# Phase 5 settles the base model (D-096), on its own:
#   quarto render r/09b_bag_power.qmd -P pipeline:v5
# 09a's fits take hours on a cold cache; render it from a terminal.

project:
  type: default
  render:
    - 02_build_grid.qmd
    - 02a_infrastructure.qmd
    - 03_review_vessels.qmd
    - 03b_port_visits.qmd
    - 04_classify_aggregate.qmd
    - 05_prepare_analysis.qmd
    - 05a_export_rasters.qmd
    - 06_explore.qmd
    - 07_spatial_global.qmd
    - 08_spatial_local.qmd
    - 09a_bag_fit.qmd
    - 09_bag.qmd
