project:
  type: default
  output-dir: .

# The chunks are Python, executed through Jupyter. Naming the engine means
# Quarto does not have to infer it, and makes the requirement explicit to a
# reader. Render with `uv run quarto render` so the interpreter resolved is the
# project's locked environment rather than whatever python is on PATH.
engine: jupyter

format:
  html:
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: true
    theme: cosmo
    code-fold: true
    code-tools: true
    df-print: kable
    fig-cap-location: top
    fig-width: 9
    fig-dpi: 160
    embed-resources: true

execute:
  echo: true
  warning: false
  message: false
  # Only re-execute a document whose source changed. Results are cached under
  # reports/_freeze/, which is committed: it is what lets someone without a GFW
  # API token render these reports from a bare clone. Editing a .qmd re-executes
  # that document, which does need the extracts -- so refresh the cache in the
  # same commit as the edit.
  freeze: auto

author: "Malachy McCaffrey"
date: last-modified
date-format: "D MMMM YYYY"
